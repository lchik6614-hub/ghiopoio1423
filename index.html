<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1478dc" />
    <title>ART_EMOJI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="loader" class="loader">
      <div class="loader__topbar"><span>ART_EMOJI</span><b>×</b></div>
      <div class="loader__stage">
        <div id="loader-emoji" class="loader__emoji">🎨</div>
        <div id="loader-text" class="loader__text">Создаём что-то красивое</div>
        <div class="loader__hint">Рекомендуется <strong>ARTEMOJI</strong></div>
        <div class="loader__dots"><i></i><i></i><i></i></div>
      </div>
    </div>

    <div id="app" class="app hidden">
      <header class="topbar">
        <div class="topbar__title">ART_EMOJI</div>
        <div class="topbar__actions"><span>⋮</span><span>×</span></div>
      </header>

      <main>
        <section class="account-strip">
          <strong id="account-name">ART_EMOJI</strong>
          <span class="balance-pill">◉ <b id="top-balance">0</b></span>
        </section>

        <section id="create-view" class="view">
          <div class="summary-row">
            <div><small>ТЕКСТ</small><strong id="summary-text">—</strong></div>
            <div><small>К СПИСАНИЮ</small><strong id="summary-cost">0 ⭐</strong></div>
          </div>

          <div class="editor-card">
            <label class="text-input-wrap">
              <input id="emoji-text" maxlength="16" placeholder="ВВЕДИТЕ ТЕКСТ" autocomplete="off" />
              <span class="image-icon">▧</span>
            </label>
          </div>
          <div id="selected-preview" class="selected-preview hidden">
            <div id="lottie-inline" class="lottie-inline"></div>
            <span id="selected-preview-label">Анимация шаблона</span>
          </div>

          <div class="section-heading">
            <h2>ПЕРСОНАЖИ</h2>
            <span id="template-count">50</span>
          </div>
          <div id="template-grid" class="template-grid"></div>
        </section>

        <section id="profile-view" class="view hidden">
          <div class="profile-card">
            <div id="profile-avatar" class="avatar">👤</div>
            <h1 id="profile-name">ART_EMOJI</h1>
            <p class="profile-balance">БАЛАНС: <strong id="profile-balance">0</strong> ⭐</p>
            <div class="profile-divider"></div>
            <div class="language-row"><span>LANGUAGE</span><button>◉ &nbsp; RU</button></div>
          </div>
          <div class="topup-card">
            <h2>ПОПОЛНЕНИЕ</h2>
            <button class="payment-option" data-topup="stars"><span class="pay-icon stars">★</span><strong>TELEGRAM STARS</strong><b>›</b></button>
            <button class="payment-option" data-topup="crypto"><span class="pay-icon crypto">▣</span><strong>КРИПТОБОТ</strong><b>›</b></button>
            <div class="promo-row"><input placeholder="ПРОМОКОД" /><button>ВВЕСТИ</button></div>
          </div>
        </section>
      </main>

      <div id="purchase-panel" class="purchase-panel hidden">
        <div><span>ВЫБРАНО</span><strong id="selected-count">0 эмодзи</strong></div>
        <div class="purchase-price"><strong id="purchase-stars">0 ⭐</strong><small id="purchase-usd">$0.00</small></div>
        <button id="buy-button" type="button">КУПИТЬ</button>
      </div>

      <nav class="bottom-nav">
        <button class="nav-button active" data-view="create-view"><span>♧</span><b>СОЗДАТЬ</b></button>
        <button class="nav-button disabled" type="button"><span>♔</span><b>РОЗЫГРЫШ</b></button>
        <button class="nav-button" data-view="profile-view"><span>♙</span><b>ПРОФИЛЬ</b></button>
      </nav>
      <footer>@ART_EMOJI</footer>
    </div>

    <div id="payment-modal" class="modal hidden">
      <div class="modal__backdrop"></div>
      <div class="modal__card payment-modal-card">
        <button id="close-payment" class="modal__close" type="button">×</button>
        <h2>Выбери оплату</h2>
        <p id="payment-description">После выбора откроется бот и выставит счёт.</p>
        <button class="payment-choice" data-payment="stars"><span>⭐</span><strong>Telegram Stars</strong><small id="payment-stars">0 ⭐</small></button>
        <button class="payment-choice" data-payment="crypto"><span>💎</span><strong>CryptoBot / USDT</strong><small id="payment-usd">0.00 USDT</small></button>
      </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
